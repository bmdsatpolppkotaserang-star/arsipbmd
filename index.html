<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsip Digital BMD - Satpol PP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- NAVBAR -->
  <nav class="bg-blue-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-blue-700 p-2 rounded-lg font-bold">BMD</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Arsip Digital BMD</h1>
          <p class="text-xs text-blue-200">Satuan Polisi Pamong Praja</p>
        </div>
      </div>
      <div id="navUser" class="hidden flex items-center gap-4">
        <span id="userNameTag" class="text-sm bg-blue-800 px-3 py-1 rounded-full border border-blue-700"></span>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded font-medium transition">Logout</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-6">

    <!-- VIEW 1: LOGIN -->
    <div id="viewLogin" class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl shadow-md border border-slate-200">
      <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Sistem Informasi Arsip BMD</h2>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Username</label>
          <input type="text" id="loginUsername" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition">Masuk System</button>
      </form>
    </div>

    <!-- VIEW 2: DASHBOARD (AFTER LOGIN) -->
    <div id="viewDashboard" class="hidden space-y-6">

      <!-- ACTION BUTTONS KHUSUS ADMIN -->
      <div id="adminPanel" class="hidden bg-blue-50 p-4 rounded-xl border border-blue-200 flex flex-wrap gap-3 items-center justify-between">
        <span class="text-sm font-semibold text-blue-900">Panel Pengelola / Admin:</span>
        <div class="flex gap-2">
          <button onclick="openModal('modalUpload')" class="bg-blue-700 hover:bg-blue-800 text-white text-sm px-4 py-2 rounded-lg font-medium shadow transition">+ Upload Berkas</button>
          <button onclick="openModal('modalCategory')" class="bg-emerald-700 hover:bg-emerald-800 text-white text-sm px-4 py-2 rounded-lg font-medium shadow transition">+ Tempat Arsip (Kategori)</button>
          <button onclick="openModal('modalUser')" class="bg-purple-700 hover:bg-purple-800 text-white text-sm px-4 py-2 rounded-lg font-medium shadow transition">+ Buat Akun Staf</button>
        </div>
      </div>

      <!-- FILTER & SEARCH BAR -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Cari Nama Dokumen</label>
          <input type="text" id="searchKeyword" oninput="filterData()" placeholder="Ketik nama berkas..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Filter Tempat Arsip / Kategori</label>
          <select id="filterCategory" onchange="filterData()" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Semua Kategori --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Filter Tahun</label>
          <input type="number" id="filterYear" oninput="filterData()" placeholder="Contoh: 2026" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- TABEL DAFTAR ARSIP -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
          <h3 class="font-bold text-slate-700">Daftar Dokumen BMD</h3>
          <span id="docCount" class="text-xs bg-slate-200 px-2.5 py-1 rounded-full font-medium">0 Dokumen</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-600 text-xs uppercase font-semibold border-b">
                <th class="p-4">Nama Dokumen</th>
                <th class="p-4">Kategori / Tempat</th>
                <th class="p-4">Tahun</th>
                <th class="p-4">Pengunggah</th>
                <th class="p-4 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y text-sm">
              <!-- Data dimasukkan secara dinamis lewat JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL 1: UPLOAD DOKUMEN -->
  <div id="modalUpload" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <h3 class="font-bold text-lg text-slate-800">Upload Berkas Arsip BMD</h3>
      <form onsubmit="submitUpload(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">Judul Dokumen</label>
          <input type="text" id="upJudul" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Pilih Tempat Arsip / Kategori</label>
          <select id="upKategori" required class="w-full px-3 py-2 border rounded-lg text-sm"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Tahun Dokumen</label>
          <input type="number" id="upTahun" value="2026" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Pilih File (PDF/Gambar/Excel)</label>
          <input type="file" id="upFile" required class="w-full text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modalUpload')" class="px-4 py-2 border rounded-lg text-xs font-semibold">Batal</button>
          <button type="submit" id="btnSubmitUpload" class="px-4 py-2 bg-blue-900 text-white rounded-lg text-xs font-semibold">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: TAMBAH KATEGORI KUSTOM -->
  <div id="modalCategory" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <h3 class="font-bold text-lg text-slate-800">Tambah Kategori / Tempat Arsip</h3>
      <form onsubmit="submitCategory(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">Nama Tempat Arsip Baru</label>
          <input type="text" id="newCatName" placeholder="Contoh: SERTIFIKAT TANAH SATPOL PP" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modalCategory')" class="px-4 py-2 border rounded-lg text-xs font-semibold">Batal</button>
          <button type="submit" class="px-4 py-2 bg-emerald-700 text-white rounded-lg text-xs font-semibold">Simpan Kategori</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 3: TAMBAH USER -->
  <div id="modalUser" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <h3 class="font-bold text-lg text-slate-800">Buat Akun Pegawai/Staf Baru</h3>
      <form onsubmit="submitUser(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">Nama Lengkap</label>
          <input type="text" id="uNama" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Username</label>
          <input type="text" id="uUsername" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Password</label>
          <input type="password" id="uPassword" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Role / Hak Akses</label>
          <select id="uRole" class="w-full px-3 py-2 border rounded-lg text-sm">
            <option value="user">User / Staf (Hanya Download)</option>
            <option value="admin">Admin (Akses Penuh)</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modalUser')" class="px-4 py-2 border rounded-lg text-xs font-semibold">Batal</button>
          <button type="submit" class="px-4 py-2 bg-purple-700 text-white rounded-lg text-xs font-semibold">Buat Akun</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LOGIC APPLIKASI (JAVASCRIPT) -->
  <script>
    // PASTE WEB APP URL APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbzRjZq_r2Ibo9EIQJPMPsCBd7sfi1T2frN6SXnqEnl1A1xYJQNZJv5xHi7083Q_wjkr/exec";

    let currentUser = null;
    let globalCategories = [];
    let globalDocuments = [];

    window.onload = function() {
      const savedUser = localStorage.getItem("bmd_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      btn.innerText = "Memeriksa...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "login",
          username: document.getElementById("loginUsername").value,
          password: document.getElementById("loginPassword").value
        })
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === "success") {
          currentUser = res.user;
          localStorage.setItem("bmd_user", JSON.stringify(currentUser));
          initDashboard();
        } else {
          alert(res.message);
        }
      })
      .catch(err => alert("Terjadi kesalahan koneksi"))
      .finally(() => {
        btn.innerText = "Masuk System";
        btn.disabled = false;
      });
    }

    function initDashboard() {
      document.getElementById("viewLogin").classList.add("hidden");
      document.getElementById("viewDashboard").classList.remove("hidden");
      document.getElementById("navUser").classList.remove("hidden");
      document.getElementById("userNameTag").innerText = `${currentUser.nama} (${currentUser.role.toUpperCase()})`;

      if(currentUser.role === "admin") {
        document.getElementById("adminPanel").classList.remove("hidden");
      }

      loadData();
    }

    function loadData() {
      fetch(`${API_URL}?action=getInitialData`)
      .then(res => res.json())
      .then(res => {
        if(res.status === "success") {
          globalCategories = res.categories;
          globalDocuments = res.documents;
          populateCategories();
          renderTable(globalDocuments);
        }
      });
    }

    function populateCategories() {
      const filter = document.getElementById("filterCategory");
      const upCat = document.getElementById("upKategori");
      
      filter.innerHTML = `<option value="">-- Semua Kategori --</option>`;
      upCat.innerHTML = ``;

      globalCategories.forEach(c => {
        filter.innerHTML += `<option value="${c}">${c}</option>`;
        upCat.innerHTML += `<option value="${c}">${c}</option>`;
      });
    }

    function renderTable(docs) {
  const tbody = document.getElementById("tableBody");
  document.getElementById("docCount").innerText = `${docs.length} Dokumen`;

  if (docs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Tidak ada dokumen ditemukan.</td></tr>`;
    return;
  }

  // Cek apakah pengguna saat ini adalah admin
  const isAdmin = currentUser && currentUser.role === "admin";

  tbody.innerHTML = docs.map(d => `
    <tr class="hover:bg-slate-50 border-b border-slate-100">
      <td class="p-4 font-semibold text-blue-900">${d.judul}</td>
      <td class="p-4"><span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-blue-200">${d.kategori}</span></td>
      <td class="p-4 font-mono text-slate-600">${d.tahun}</td>
      <td class="p-4 text-xs text-slate-500">${d.uploaded_by}</td>
      <td class="p-4 text-center">
        <div class="flex items-center justify-center gap-2">
          <a href="${d.file_url}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded inline-flex items-center gap-1 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Unduh / Lihat
          </a>
          ${isAdmin ? `
            <button onclick="deleteDoc('${d.id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1.5 rounded inline-flex items-center gap-1 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              Hapus
            </button>
          ` : ''}
        </div>
      </td>
    </tr>
  `).join("");
}

function deleteDoc(id) {
  if (!confirm("Apakah Anda yakin ingin menghapus berkas ini dari database dan Google Drive?")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "deleteDocument",
      id: id
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === "success") {
      alert(res.message);
      loadData(); // Reload tabel secara otomatis
    } else {
      alert("Gagal menghapus: " + res.message);
    }
  })
  .catch(err => alert("Terjadi kesalahan koneksi saat menghapus berkas."));
}

    function filterData() {
      const keyword = document.getElementById("searchKeyword").value.toLowerCase();
      const cat = document.getElementById("filterCategory").value;
      const year = document.getElementById("filterYear").value;

      const filtered = globalDocuments.filter(d => {
        const matchKey = d.judul.toLowerCase().includes(keyword);
        const matchCat = cat === "" || d.kategori === cat;
        const matchYear = year === "" || d.tahun.toString() === year.toString();
        return matchKey && matchCat && matchYear;
      });

      renderTable(filtered);
    }

    function submitUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById("upFile").files[0];
      const btn = document.getElementById("btnSubmitUpload");
      btn.innerText = "Mengunggah...";
      btn.disabled = true;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const payload = {
          action: "uploadDocument",
          judul: document.getElementById("upJudul").value,
          kategori: document.getElementById("upKategori").value,
          tahun: document.getElementById("upTahun").value,
          uploaded_by: currentUser.nama,
          file: {
            name: fileInput.name,
            type: fileInput.type,
            base64: evt.target.result
          }
        };

        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(res => {
          alert(res.message);
          closeModal("modalUpload");
          loadData();
        })
        .finally(() => {
          btn.innerText = "Upload";
          btn.disabled = false;
        });
      };
      reader.readAsDataURL(fileInput);
    }

    function submitCategory(e) {
      e.preventDefault();
      const name = document.getElementById("newCatName").value;
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "addCategory", nama_kategori: name })
      })
      .then(r => r.json())
      .then(res => {
        alert(res.message);
        closeModal("modalCategory");
        loadData();
      });
    }

    function submitUser(e) {
      e.preventDefault();
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "addUser",
          nama: document.getElementById("uNama").value,
          username: document.getElementById("uUsername").value,
          password: document.getElementById("uPassword").value,
          role: document.getElementById("uRole").value
        })
      })
      .then(r => r.json())
      .then(res => {
        alert(res.message);
        closeModal("modalUser");
      });
    }

    function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
    function logout() {
      localStorage.removeItem("bmd_user");
      location.reload();
    }
  </script>
</body>
</html>
